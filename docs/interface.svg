<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Xbox HDD Manager interface illustration</title><desc id="desc">Illustrative views of the main window and busy partition recovery dialog.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1917"/><stop offset="1" stop-color="#142a20"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="150%" height="180%"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-opacity=".34"/></filter></defs>
<rect width="1440" height="820" fill="url(#bg)"/><circle cx="1260" cy="80" r="280" fill="#1e4e34" opacity=".25"/><circle cx="80" cy="820" r="300" fill="#2a7350" opacity=".12"/>
<g font-family="DejaVu Sans, sans-serif"><text x="80" y="95" fill="#c5f4ce" font-size="14" font-weight="bold" letter-spacing="3">XBOX HDD MANAGER</text><text x="80" y="153" fill="white" font-size="42" font-weight="bold">Your disk images, under control.</text><text x="80" y="188" fill="#abc5b3" font-size="18">Select an image, manage FATX partitions and disconnect safely.</text>
<g filter="url(#shadow)"><rect x="80" y="245" width="790" height="450" rx="16" fill="#f6f7f5"/><path d="M96 245h758a16 16 0 0 1 16 16v44H80v-44a16 16 0 0 1 16-16" fill="#29332e"/><text x="108" y="283" fill="white" font-size="18" font-weight="bold">Xbox HDD Manager</text><circle cx="837" cy="275" r="8" fill="#78877d"/>
<text x="112" y="344" fill="#24322a" font-size="17" font-weight="bold">Xbox disk image (QCOW2 or RAW)</text><rect x="112" y="362" width="505" height="50" rx="7" fill="white" stroke="#c4d0c6"/><text x="127" y="393" fill="#4a5c50" font-size="15">~/Xbox/example.qcow2</text><path d="M589 383l7 8 7-8" fill="none" stroke="#4a5c50" stroke-width="2"/><rect x="633" y="362" width="204" height="50" rx="7" fill="#e5ece5" stroke="#c4d0c6"/><text x="667" y="393" fill="#26392b" font-size="15">Add image…</text>
<rect x="112" y="440" width="19" height="19" rx="4" fill="#3eab63"/><path d="M116 450l4 4 7-9" fill="none" stroke="white" stroke-width="2.5"/><text x="144" y="455" fill="#24322a" font-size="15">Read-only (disable to edit; an automatic backup is required)</text>
<rect x="112" y="489" width="725" height="75" rx="7" fill="#edf3ed"/><circle cx="135" cy="515" r="5" fill="#52ac70"/><text x="151" y="520" fill="#243d2c" font-size="15">Disk disconnected. Close xemu before mounting.</text><text x="151" y="545" fill="#62776a" font-size="13">Mounts and backups are stored in the application directory.</text>
<rect x="112" y="605" width="140" height="48" rx="7" fill="#358f55"/><text x="156" y="635" fill="white" font-weight="bold" font-size="15">Mount</text><rect x="264" y="605" width="213" height="48" rx="7" fill="white" stroke="#c4d0c6"/><text x="283" y="635" fill="#243d2c" font-size="14">Unmount and disconnect</text><rect x="489" y="605" width="158" height="48" rx="7" fill="white" stroke="#c4d0c6"/><text x="512" y="635" fill="#243d2c" font-size="14">Create backup</text><rect x="659" y="605" width="178" height="48" rx="7" fill="white" stroke="#c4d0c6"/><text x="691" y="635" fill="#243d2c" font-size="14">Open folder</text></g>
<g filter="url(#shadow)"><rect x="910" y="321" width="450" height="336" rx="14" fill="#f9faf8"/><rect x="910" y="321" width="450" height="53" rx="14" fill="#29332e"/><rect x="910" y="358" width="450" height="16" fill="#29332e"/><text x="935" y="355" fill="white" font-size="16" font-weight="bold">Partition in use</text><circle cx="951" cy="416" r="17" fill="#fff0c2"/><text x="947" y="422" fill="#7f5900" font-size="18" font-weight="bold">!</text><text x="982" y="411" fill="#223328" font-size="16" font-weight="bold">Unmount postponed</text><text x="982" y="438" fill="#5c6b60" font-size="14">E: nautilus (PID 1234)</text><text x="935" y="487" fill="#38483b" font-size="14">Wait for file operations to finish, then</text><text x="935" y="510" fill="#38483b" font-size="14">close Files and retry when ready.</text><rect x="935" y="552" width="168" height="44" rx="7" fill="white" stroke="#c4d0c6"/><text x="955" y="579" fill="#344a39" font-size="14">Leave connected</text><rect x="1114" y="552" width="221" height="44" rx="7" fill="#358f55"/><text x="1144" y="579" fill="white" font-weight="bold" font-size="14">Close Files and retry</text><text x="935" y="628" fill="#718075" font-size="12">No process is closed without your choice.</text></g>
<text x="80" y="765" fill="#87a393" font-size="13">Interface illustration • Paths and process identifiers are examples</text></g></svg>
