name: Ubuntu 22.04 compatibility
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install build and runtime dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libfuse-dev fuse qemu-utils python3 python3-gi gir1.2-gtk-3.0 acl psmisc pkexec kmod util-linux xdg-utils desktop-file-utils
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Build FATX driver
        run: |
          cmake -S driver/libfatx -B /tmp/fatx-lib -DCMAKE_INSTALL_PREFIX=/tmp/fatx-prefix
          cmake --build /tmp/fatx-lib -j 2
          cmake --install /tmp/fatx-lib
          cmake -S driver/fatxfs -B /tmp/fatx-fuse -DCMAKE_PREFIX_PATH=/tmp/fatx-prefix
          cmake --build /tmp/fatx-fuse -j 2
      - name: Install and uninstall in a temporary directory
        run: bash tests/test_installer.sh
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh xbox-hdd-manager.sh tests/test_image.sh
